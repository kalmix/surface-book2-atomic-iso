name: Build Surface Book 2 Atomic ISO

# ==============================================================================
# GitHub Actions CI/CD Pipeline
# Compiles OCI Image & Builds Bootable Unattended ISO via bootc-image-builder
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      push_ghcr:
        description: 'Push compiled OCI image to GitHub Container Registry (GHCR)'
        type: boolean
        required: false
        default: true
      iso_filename:
        description: 'Target filename for the generated bootable ISO'
        type: string
        required: false
        default: 'surface-book-2-silverblue-40.iso'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build OCI Image and Generate Unattended ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Maximize Runner Build Space
        run: |
          echo "=== Initial Disk Utilization ==="
          df -h
          echo "Freeing pre-installed runner software to ensure ~75GB+ free space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "=== Reclaimed Disk Space ==="
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment Variables
        id: vars
        run: |
          IMAGE_NAME="surface-book2-atomic"
          IMAGE_TAG="40"
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${LOWER_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"
          LOCAL_IMAGE="localhost/${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "ghcr_image=${GHCR_IMAGE}" >> $GITHUB_OUTPUT
          echo "local_image=${LOCAL_IMAGE}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ inputs.push_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI Image with Podman
        run: |
          echo "=== Building Surface Book 2 Atomic OCI Container ==="
          sudo podman build \
            --build-arg SURFACE_RELEASEVER=${{ steps.vars.outputs.image_tag }} \
            -t ${{ steps.vars.outputs.local_image }} \
            -t ${{ steps.vars.outputs.ghcr_image }} \
            -f Containerfile .

          echo "=== Container Image Built Successfully ==="
          sudo podman images

      - name: Push Image to GHCR
        if: ${{ inputs.push_ghcr }}
        run: |
          echo "=== Pushing image to GHCR: ${{ steps.vars.outputs.ghcr_image }} ==="
          sudo podman push ${{ steps.vars.outputs.ghcr_image }}

      - name: Generate Bootable ISO with bootc-image-builder
        run: |
          echo "=== Preparing ISO build environment ==="
          mkdir -p output
          chmod 777 output

          echo "=== Running bootc-image-builder container ==="
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            -v $(pwd)/config/config.toml:/config.toml:ro \
            -v $(pwd)/output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            --local \
            ${{ steps.vars.outputs.local_image }}

      - name: Process, Validate & Checksum Generated ISO
        run: |
          echo "=== Fixing output permissions ==="
          sudo chown -R $USER:$USER output
          echo "=== Scanning output directory ==="
          ls -la output/
          find output -type f

          RAW_ISO=$(find output -name "*.iso" | head -n 1)
          if [ -z "$RAW_ISO" ]; then
            echo "ERROR: No .iso file was generated by bootc-image-builder!"
            exit 1
          fi

          TARGET_ISO="output/${{ inputs.iso_filename }}"
          if [ "$RAW_ISO" != "$TARGET_ISO" ]; then
            echo "Moving $RAW_ISO to $TARGET_ISO..."
            mv "$RAW_ISO" "$TARGET_ISO"
          fi

          echo "Generating SHA256 verification hash..."
          cd output
          sha256sum "${{ inputs.iso_filename }}" > "${{ inputs.iso_filename }}.sha256"
          cat "${{ inputs.iso_filename }}.sha256"
          ls -lh "${{ inputs.iso_filename }}"

      - name: Upload Bootable ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.iso_filename }}
          path: |
            output/${{ inputs.iso_filename }}
            output/${{ inputs.iso_filename }}.sha256
          retention-days: 5
          compression-level: 1
          if-no-files-found: error
