---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: silverblue-surface-book2
description: Fedora Silverblue 40 Atomic Desktop for Microsoft Surface Book 2 (Intel i7 + GTX 1050, 65W USB-C Resilience)
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: 40

modules:
  - type: files
    files:
      - usr: /usr
      - etc: /etc

  - type: rpm-ostree
    repos:
      - https://pkg.surfacelinux.com/fedora/linux-surface.repo
      - https://repo.librewolf.net/librewolf.repo
    keys:
      - https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc
      - https://repo.librewolf.net/pubkey.gpg
    remove:
      - kernel
      - kernel-core
      - kernel-modules
      - kernel-modules-core
      - kernel-modules-extra
      - libwacom
      - libwacom-data
    install:
      # Official Linux Surface Kernel & Hardware Stack
      - kernel-surface
      - kernel-surface-devel
      - iptsd
      - surface-dtx-daemon
      - libwacom-surface
      - libwacom-surface-data
      - surface-secureboot
      # Thermal & Power Management Tools
      - msr-tools
      - python3-pip
      - git
      # Native Pre-installed Software
      - librewolf
      - deskflow

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
        repo-name: flathub
        install:
          - org.localsend.localsend_app
          - org.deskflow.Deskflow

  - type: systemd
    system:
      enabled:
        - iptsd.service
        - surface-dtx-daemon.service
        - throttled.service
        - surface-nvidia-power-limit.service
        - surface-bdprochot-fallback.service
        - surface-firstboot.service

  - type: script
    scripts:
      - setup-surface-kernel.sh
