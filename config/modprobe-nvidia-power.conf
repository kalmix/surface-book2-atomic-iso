# ==============================================================================
# /etc/modprobe.d/nvidia-power.conf
# Enforce adaptive PowerMizer behavior on AC to avoid transient current spikes
# ==============================================================================

# PowerMizerEnable=0x1: Enable PowerMizer power management
# PowerMizerDefaultAC=0x2: Adaptive mode on AC (avoids locking to max power state P0)
# PowerMizerDefault=0x2: Adaptive mode default
# PerfLevelSrc=0x3322: Allow adaptive scaling based on load
options nvidia NVreg_RegistryDwords="PowerMizerEnable=0x1;PowerMizerDefaultAC=0x2;PowerMizerDefault=0x2;PerfLevelSrc=0x3322;"
