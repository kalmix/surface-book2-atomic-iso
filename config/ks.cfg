# ==============================================================================
# Microsoft Surface Book 2 (13.5", Intel Core i7, NVIDIA GTX 1050)
# Fedora Silverblue 40 Unattended Kickstart Configuration (ks.cfg)
# Optimized for AC-only operation with degraded/dead battery telemetry
# ==============================================================================

# General Installation Directives
text
cmdline
skipx
firstboot --disable

# Localization & Input Configuration
lang en_US.UTF-8
keyboard us
timezone America/Santo_Domingo --utc

# Network Configuration
network --bootproto=dhcp --device=link --activate --onboot=on

# Storage Partitioning (Surface NVMe SSD)
# Wipes all preexisting partition tables and re-initializes GPT
zerombr
clearpart --all --initlabel --disklabel=gpt

# Bootloader configuration with hardware flags
bootloader --location=mbr --append="rhgb quiet acpi_backlight=vendor intel_iommu=on mem_sleep_default=deep msr.allow_writes=on"

# Automated Partition Scheme
# Note: Allocate sufficient EFI and Boot space for Linux Surface kernels and initramfs images
part /boot/efi --fstype=efi --size=1024 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype=ext4 --size=2048
part / --fstype=ext4 --grow --size=20000

# User Accounts & Authentication
rootpw --lock
# Predefined admin user 'jsl' with wheel (sudo) privileges and initial password '123123'
user --name=jsl --groups=wheel --plaintext --password=123123

# Post-installation Action: Unattended Automatic Reboot
reboot

# ==============================================================================
# Post-Installation Customization Script (%post)
# ==============================================================================
%post --erroronfail --log=/var/log/anaconda/post-install-surface.log
echo ">>> Starting Microsoft Surface Book 2 Kickstart post-installation routines..."

# 1. Configure Passwordless Sudo for wheel group users (jsl)
echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/01-wheel-jsl
chmod 0440 /etc/sudoers.d/01-wheel-jsl

# 2. Guarantee automatic loading of the MSR module (required for throttled / BDPROCHOT fix)
cat << 'EOF' > /etc/modules-load.d/msr.conf
msr
EOF

# 3. Enable Critical Hardware and Thermal Mitigation Services
echo ">>> Enabling Surface hardware daemons, firstboot and mitigation units..."
systemctl enable iptsd.service || true
systemctl enable surface-dtx-daemon.service || true
systemctl enable throttled.service || true
systemctl enable surface-nvidia-power-limit.service || true
systemctl enable surface-bdprochot-fallback.service || true
systemctl enable surface-firstboot.service || true

# 4. Attempt online provisioning of Flatpaks if network is reachable during installation
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
flatpak install -y --system flathub org.localsend.localsend_app || true
flatpak install -y --system flathub org.deskflow.Deskflow || true

# 5. Generate welcome MOTD
cat << 'EOF' > /etc/motd
================================================================================
 Microsoft Surface Book 2 - Fedora Silverblue 40 (Atomic Desktop)
 Hardware Profile: Intel Core i7-8650U | NVIDIA GeForce GTX 1050 Mobile
 User Account: jsl (wheel / sudo)
 Power Mode: AC Wall Power Optimization (Dead Battery Resilience Mode)
 Active Protections:
   - throttled: BDPROCHOT=False (400 MHz throttle bypass active)
   - GPU Power Cap: 45W via nvidia-smi (AC supply brownout protection)
   - Drivers: kernel-surface, iptsd (touch/pen), surface-dtx-daemon (detach)
 Preloaded Software:
   - LibreWolf (RPM)
   - Deskflow (RPM / Flatpak)
   - LocalSend (Flatpak: org.localsend.localsend_app)
================================================================================
EOF

echo ">>> Surface Book 2 post-installation setup completed."
%end
