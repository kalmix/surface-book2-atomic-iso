# ==============================================================================
# throttled.conf - Intel CPU Power & BDPROCHOT Configuration
# Specialized for Microsoft Surface Book 2 with 65W USB-C Charger & Dead Batteries
# ==============================================================================

[GENERAL]
Enabled: True
SysfsPath: /sys/devices/virtual/powercap/intel-rapl/intel-rapl:0
# Autoreload configuration on file changes
Autoreload: True

[BATTERY]
Update_Rate_s: 15
PL1_Tdp_W: 12
PL1_Duration_s: 28
PL2_Tdp_W: 16
PL2_Duration_S: 0.002
Trip_Temp_C: 80
# CRITICAL FIX: Disable BDPROCHOT to prevent 400 MHz clock lock down caused
# by dead battery telemetry from the Embedded Controller (EC).
BDPROCHOT: False

[AC]
Update_Rate_s: 5
# 65W USB-C Budget Envelope (Total System ~60W):
# - 15W sustained CPU (PL1)
# - 22W short burst CPU (PL2)
# - 30W GPU cap
# - 15W display + board + NVMe
PL1_Tdp_W: 15
PL1_Duration_s: 28
PL2_Tdp_W: 22
PL2_Duration_S: 0.002
Trip_Temp_C: 85
# CRITICAL FIX: Ensure BDPROCHOT is disabled on AC power as well
BDPROCHOT: False

[UNDERVOLT.BATTERY]
# Safe defaults (0 mV offset) to prevent freeze under stress
CORE: 0
GPU: 0
CACHE: 0
UNCORE: 0
ANALOGIO: 0

[UNDERVOLT.AC]
CORE: 0
GPU: 0
CACHE: 0
UNCORE: 0
ANALOGIO: 0
