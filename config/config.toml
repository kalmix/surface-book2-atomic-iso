# ==============================================================================
# bootc-image-builder Configuration for Microsoft Surface Book 2
# Generates an unattended bootable Anaconda ISO for Fedora Silverblue 40
# Tailored for 65W USB-C Charger with 0% / dead battery telemetry
# ==============================================================================

[customizations.installer.kickstart]
contents = """
text
cmdline
skipx
firstboot --disable

lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone America/Santo_Domingo --utc

network --bootproto=dhcp --device=link --activate --onboot=on

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=plain --nohome --fstype=ext4
bootloader --location=mbr --append="rhgb quiet acpi_backlight=vendor intel_iommu=on mem_sleep_default=deep msr.allow_writes=on"

rootpw --lock
user --name=jsl --groups=wheel --plaintext --password=123123

reboot

%post --erroronfail
echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/01-wheel-jsl
chmod 0440 /etc/sudoers.d/01-wheel-jsl

cat << 'EOF' > /etc/modules-load.d/msr.conf
msr
EOF

systemctl enable iptsd.service || true
systemctl enable surface-dtx-daemon.service || true
systemctl enable throttled.service || true
systemctl enable surface-nvidia-power-limit.service || true
systemctl enable surface-bdprochot-fallback.service || true
systemctl enable surface-firstboot.service || true

# Provision Flathub and core apps
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
flatpak install -y --system flathub org.localsend.localsend_app || true
flatpak install -y --system flathub org.deskflow.Deskflow || true

cat << 'EOF' > /etc/motd
================================================================================
 Microsoft Surface Book 2 - Fedora Silverblue 40 (Atomic Desktop)
 Hardware Profile: Intel Core i7-8650U | NVIDIA GeForce GTX 1050 Mobile
 User Account: jsl (wheel / sudo)
 Power Mode: 65W USB-C Adapter Profile (Dead Battery Resilience Mode)
 Active Protections:
   - throttled: BDPROCHOT=False (400 MHz throttle bypass active)
   - CPU Limits: PL1=15W, PL2=22W (safe sustained power envelope)
   - GPU Power Cap: 30W via nvidia-smi & PowerMizer Adaptive (65W anti-brownout)
   - Drivers: kernel-surface, iptsd (touch/pen), surface-dtx-daemon (detach)
 Preloaded Software:
   - LibreWolf (RPM)
   - Deskflow (RPM / Flatpak)
   - LocalSend (Flatpak: org.localsend.localsend_app)
================================================================================
EOF
%end
"""
