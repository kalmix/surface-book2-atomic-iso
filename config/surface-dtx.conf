# ==============================================================================
# /etc/surface-dtx/surface-dtx-daemon.conf
# Surface Book 2 Detachment Daemon Configuration
# ==============================================================================

[daemon]
# Time to wait (in ms) before timing out detachment operations
detachment_timeout = 5000

[handler]
# Handlers executed before detach, after attach, etc.
# These allow gracefully warning or unbinding resources (e.g. NVIDIA dGPU in the base)
# detach_abort = "/usr/bin/surface-dtx-userd --notify"
