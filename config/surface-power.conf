# ==============================================================================
# Surface Book 2 Power Budget Configuration
# Tailored for 65W USB-C Power Adapter (Dead Battery Resilience Mode)
# ==============================================================================

# Charger Rated Capacity in Watts
CHARGER_WATTAGE=65

# Maximum allowed power consumption for the NVIDIA GTX 1050 Mobile (Watts)
# Budget Breakdown on 65W USB-C:
#   - Base System (Display, RAM, NVMe SSD, Fans, Wi-Fi): ~15W
#   - CPU Intel i7-8650U (throttled PL1 limit): ~15W
#   - GPU NVIDIA GTX 1050 (this cap): ~30W
#   - Total Peak Budget: ~60W (Leaves 5W headroom to prevent charger tripping)
GPU_TARGET_POWER_W=30

# Maximum Graphics Clock in MHz (mitigates transient power spikes if -pl is restricted)
GPU_MAX_CLOCK_MHZ=1100
